name: share_app
description: Share - divide gastos en grupo, datos guardados en Firebase (Auth + Firestore).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.4

  # Login con Apple (web: Firebase popup; móvil: sign_in_with_apple + nonce)
  # google_sign_in se añade cuando se compile para móvil (en web Firebase
  # gestiona el popup de Google directamente sin necesitar ese paquete).
  sign_in_with_apple: ^6.1.2
  crypto: ^3.0.3

  # Utilidades
  http: ^1.2.2
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  file_picker: ^8.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
