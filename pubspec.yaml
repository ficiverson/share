name: share_app
description: Share - divide gastos en grupo, datos guardados en Google Sheets/Drive del usuario.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Auth con Google
  google_sign_in: ^6.2.1

  # Acceso a Google Drive / Sheets API
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2

  # Persistencia local (sesión, caché de índices/gastos)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
