name: share_app
description: Share - divide gastos en grupo, datos guardados en Firebase (Auth + Firestore).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

  # Login con Google (credenciales pasadas a Firebase Auth)
  google_sign_in: ^6.2.1

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
