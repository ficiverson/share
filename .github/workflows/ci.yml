name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate firebase_options stub (CI only)
        run: |
          cat > lib/firebase_options.dart << 'EOF'
          // ignore_for_file: type=lint
          // Stub generado por CI. Reemplaza con: flutterfire configure
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) return web;
              switch (defaultTargetPlatform) {
                case TargetPlatform.android: return android;
                case TargetPlatform.iOS: return ios;
                default: return web;
              }
            }
            static const FirebaseOptions web = FirebaseOptions(apiKey:'CI',appId:'CI',messagingSenderId:'CI',projectId:'CI');
            static const FirebaseOptions android = FirebaseOptions(apiKey:'CI',appId:'CI',messagingSenderId:'CI',projectId:'CI');
            static const FirebaseOptions ios = FirebaseOptions(apiKey:'CI',appId:'CI',messagingSenderId:'CI',projectId:'CI',iosBundleId:'com.example.shareApp');
          }
          EOF

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test test/unit/ --reporter=expanded

      - name: Run integration tests
        run: flutter test test/integration/ --reporter=expanded

      - name: Test coverage (optional)
        run: flutter test --coverage || true
        continue-on-error: true
